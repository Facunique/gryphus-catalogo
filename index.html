<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gryphus — Catálogo</title>
  <meta name="description" content="Macetas, tótems NFC, soportes, impresión 3D a pedido y reparación de notebooks.">
  <link rel="icon" href="marca/isotipo-simple.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="marca/icono-180.png">
  <meta name="theme-color" content="#1D355B">
  <!-- Vista previa al compartir el link (WhatsApp, Instagram, etc.) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Gryphus — Catálogo 3D">
  <meta property="og:description" content="Impresión 3D, NFC y servicio técnico. Conocé el catálogo en 3D.">
  <meta property="og:image" content="https://facunique.github.io/gryphus-catalogo/marca/og-imagen.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <script>
    // Aplica el modo guardado (o el del sistema) antes de pintar, para que no parpadee.
    (function () {
      var t = null;
      try { t = localStorage.getItem('tema'); } catch (e) {}
      if (t !== 'claro' && t !== 'oscuro') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro';
      document.documentElement.dataset.tema = t;
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap">
  <link rel="stylesheet" href="estilos.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <header class="barra">
    <a class="marca" id="ir-inicio" href="./" aria-label="Gryphus, volver al inicio">
      <img class="logo-en-claro" src="marca/isotipo-terracota.svg" alt="" width="30" height="30">
      <img class="logo-en-oscuro" src="marca/isotipo-azul.svg" alt="" width="30" height="30">
      Gryphus
    </a>
    <span class="ayuda" id="ayuda">Tocá un objeto para verlo de cerca · tirá del hilo del foco para cambiar la luz</span>
  </header>
  <button id="cambiar-tema" class="cambiar-tema" type="button">Cambiar a modo oscuro</button>

  <main>
    <div id="escena" aria-hidden="true"></div>
    <div id="cargando" class="cargando">
      <img src="marca/isotipo-trama.svg" alt="" width="112" height="112">
      <span>Cargando…</span>
    </div>
    <div id="etiqueta" class="etiqueta" hidden></div>

    <aside id="panel" class="panel" aria-live="polite" hidden>
      <div class="panel-cabecera">
        <button id="volver" class="volver" type="button" aria-label="Volver a la vista general">← <span class="solo-compu">Volver</span><span class="solo-celu">Productos</span></button>
        <p id="panel-categoria" class="categoria"></p>
        <span class="pasar">
          <button id="anterior" class="flecha" type="button" aria-label="Producto anterior">‹</button>
          <button id="siguiente" class="flecha" type="button" aria-label="Producto siguiente">›</button>
        </span>
      </div>
      <h1 id="panel-nombre"></h1>
      <p id="panel-resumen" class="resumen"></p>
      <ul id="panel-detalles" class="detalles"></ul>
      <p id="panel-precio" class="precio"></p>
      <a id="panel-cta" class="cta" href="#" target="_blank" rel="noopener" hidden>Consultar por WhatsApp</a>
    </aside>

    <!-- Lista accesible y sin 3D, agrupada por zona: sirve para teclado, lectores de pantalla, buscadores y equipos sin WebGL -->
    <nav class="indice" aria-label="Productos">
      <!-- En celular el índice se abre como una hoja desde abajo con este botón -->
      <button id="abrir-indice" class="abrir-indice" type="button" aria-expanded="false" aria-controls="indice-hoja">
        <span aria-hidden="true">☰</span> Ver productos
      </button>
      <div id="fondo-hoja" class="fondo-hoja" hidden></div>
      <div id="indice-hoja" class="indice-hoja">
        <div class="hoja-cabecera">
          <span class="hoja-titulo">Productos</span>
          <button id="cerrar-indice" class="cerrar-indice" type="button" aria-label="Cerrar la lista de productos">✕</button>
        </div>
        <ul id="indice"></ul>
      </div>
    </nav>
  </main>

  <script type="module" src="main.js"></script>
</body>
</html>
